spring:
  application:
    name: waste-sorting-station
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wastedb}
    username: ${SPRING_DATASOURCE_USERNAME:waste}
    password: ${SPRING_DATASOURCE_PASSWORD:waste123}
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 1h

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    # 生产环境务必通过环境变量覆盖
    secret: ${JWT_SECRET:change-me-please-change-me-please-0123456789abcdef}
    ttl-minutes: ${JWT_TTL_MINUTES:720}
  points:
    # 各类垃圾每公斤积分
    per-kg:
      KITCHEN: 2
      RECYCLABLE: 3
      HAZARDOUS: 5
      OTHER: 1
    bag-broken-bonus: 1
    review-deduct: 10
  rules:
    # 误投率告警阈值（最近 7 天）
    missort-rate-threshold: 0.15
    missort-min-disposals: 5
    # 复核 SLA（小时）
    review-sla-hours: 24
    # 兑换违规拦截：最近 90 天 MINOR 及以上违规次数上限
    redeem-violation-limit: 3
    redeem-violation-days: 90
    # 清运称重异常偏差阈值
    weigh-anomaly-ratio: 0.2
    # 预约到货后的领取窗口（分钟），超时自动回滚
    reservation-pickup-minutes: 4320
    # 定时巡检间隔（毫秒）
    watchdog-delay-ms: 60000

logging:
  level:
    root: info
    com.community.waste: info
